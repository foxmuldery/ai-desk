name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: server
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        env:
          PYTHONPATH: server
        run: python -m compileall -q server tests
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
      - name: Check safe shell script syntax
        run: sh -n scripts/run-local.sh scripts/check-codex.sh scripts/smoke-codex-readonly.sh
